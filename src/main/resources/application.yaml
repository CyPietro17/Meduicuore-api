# ========================================
# Spring Application Configuration
# ========================================
spring:
  application:
    name: medicuore
  
  jmx:
    default-domain: medicuore
  
  # ========================================
  # Database Configuration
  # ========================================
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  # ========================================
  # Security Configuration
  # ========================================
  security:
    user:
      name: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
      roles: ADMIN

# ========================================
# Server Configuration
# ========================================
server:
  servlet:
    context-path: /medicuore
  port: ${SERVER_PORT}

# ========================================
# Logging Configuration
# ========================================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    it.pietro.salvatore.medicuore: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ========================================
# JWT Configuration
# ========================================
jwt:
  # Chiave segreta per firmare i token (minimo 256 bit = 32 caratteri)
  # IMPORTANTE: Questa deve essere sovrascritta con una variabile d'ambiente in produzione
  secret: ${JWT_SECRET}

  # Durata dell'access token in minuti (default: 15 minuti)
  access-token:
    expiration: ${JWT_ACCESS_EXPIRATION}

  # Durata del refresh token in giorni (default: 7 giorni)
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION}

  # Issuer del token (identificativo dell'applicazione)
  issuer: ${JWT_ISSUER}

# ========================================
# CORS Configuration
# ========================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  max-age: 3600

# ========================================
# Springdoc OpenAPI Configuration
# ========================================
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    try-it-out-enabled: true
    filter: true
  
  packages-to-scan: it.pietro.salvatore.medicuore
  paths-to-match: /**
  override-with-generic-response: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: false
